[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-trading-bot"
version = "0.1.0"
description = "Containerized multi-asset algorithmic trading bot with risk management, backtesting, and dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
runtime = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "motor>=3.5",
  "httpx>=0.27",
  "yfinance>=0.2",
  "polygon-api-client>=1.14",
  "alpha-vantage>=2.3",
  "finnhub-python>=2.4",
  "alpaca-py>=0.28",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "hmmlearn>=0.3",
  "celery>=5.4",
]
mt5 = ["MetaTrader5>=5.0.45"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
