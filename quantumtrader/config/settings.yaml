app:
  name: QuantumTrader
  environment: production
  timezone: UTC
  trading_mode: paper
  enable_live_trading: false

universe:
  symbols:
    - SPY
    - QQQ
    - IWM
    - GLD
    - TLT
    - AAPL
    - MSFT
    - NVDA
    - EURUSD=X
    - GBPUSD=X
    - BTC-USD
    - ETH-USD
  max_selected_assets: 15

data:
  default_provider: yfinance
  bar_interval: 1d
  history_days: 800
  utc_align: true
  outlier_zscore: 8.0
  redis_ticks_channel: ticks
  live_updates_channel: live_equity
  collection_interval_hours: 24

strategy:
  weights:
    trend_following: 0.30
    momentum: 0.25
    mean_reversion: 0.20
    ml_predictor: 0.25
  trend_following:
    fast_ema: 20
    slow_ema: 50
    adx_min: 25
    atr_stop_multiple: 2.0
    atr_target_multiple: 3.0
  momentum:
    rsi_period: 14
    atr_stop_multiple: 1.5
  mean_reversion:
    window: 20
    stddev: 2.0
    z_entry: -2.0
  ml_predictor:
    probability_buy: 0.60
    probability_sell: 0.40
    model_path: models/lightgbm_direction.txt

selection:
  weights:
    momentum_20d: 0.25
    volume_growth_5d: 0.15
    adx: 0.10
    atr_inverse: 0.10
    sentiment: 0.15
    sharpe_60d: 0.25

risk:
  max_daily_loss_pct: 0.02
  risk_per_trade_pct: 0.01
  atr_position_multiple: 2.0
  max_position_pct: 0.25
  max_assets_per_sector: 2
  max_drawdown_pct: 0.20
  max_leverage: 2.0
  max_correlation: 0.80
  correlation_lookback_days: 60

broker:
  paper:
    starting_equity: 100000
    commission_bps: 1.0
    slippage_bps: 2.0
  alpaca:
    paper: true
  metatrader5:
    enabled: false
    terminal_path: ""

backtest:
  initial_cash: 100000
  commission_bps: 1.0
  slippage_bps: 2.0
  walk_forward:
    train_pct: 0.60
    validation_pct: 0.20
    test_pct: 0.20
    min_oos_sharpe_ratio: 0.50

scheduler:
  nightly_retrain_cron: "0 2 * * *"
  weekly_backtest_cron: "0 3 * * 0"
  asset_scoring_cron: "0 6 * * *"

dashboard:
  cors_origins:
    - http://localhost
    - http://127.0.0.1
  jwt_expire_minutes: 720
