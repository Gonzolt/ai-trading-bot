services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_password}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &json_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging: *json_logging

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    logging: *json_logging

  data_collector:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "trading_bot.services.data_collector"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    restart: unless-stopped
    logging: *json_logging

  signal_engine:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "trading_bot.services.signal_engine"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - model_data:/app/models
    depends_on:
      data_collector:
        condition: service_started
    restart: unless-stopped
    logging: *json_logging

  risk_manager:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "trading_bot.services.risk_manager"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *json_logging

  broker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "trading_bot.services.broker"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *json_logging

  scheduler:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command:
      [
        "celery",
        "-A",
        "trading_bot.services.scheduler:celery_app",
        "worker",
        "--beat",
        "--loglevel=INFO"
      ]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - model_data:/app/models
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *json_logging

  dashboard_api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["uvicorn", "trading_bot.dashboard.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging: *json_logging

  dashboard_ui:
    build:
      context: ./dashboard-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: /ws/live
    restart: unless-stopped
    logging: *json_logging

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      dashboard_api:
        condition: service_started
      dashboard_ui:
        condition: service_started
    restart: unless-stopped
    logging: *json_logging

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  model_data:
